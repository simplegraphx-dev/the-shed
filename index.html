<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Health Ledger</title>
<link rel="apple-touch-icon" href="icon-180.png?v=3">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=3">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png?v=3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Health Ledger">
<meta name="theme-color" content="#0f2420">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0f2420;
    --surface:#132e29;
    --ink:#f5f8f7;
    --ink-soft:#9db3ac;
    --accent:#2dd4bf;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;overscroll-behavior:none;}
  body{
    background:var(--bg);
    display:flex;
    flex-direction:column;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  .shell-tabs{
    display:flex; gap:6px; padding: max(10px, env(safe-area-inset-top)) 10px 8px;
    background:var(--surface); flex-shrink:0;
  }
  .shell-tab{
    flex:1; text-align:center; padding:10px 0; border-radius:12px;
    font-family:'Space Grotesk', sans-serif; font-weight:600; font-size:14px;
    color:var(--ink-soft); background:transparent; cursor:pointer;
    border:1px solid transparent; transition: all .15s ease;
  }
  .shell-tab.active{ background:var(--accent); color:#062420; border-color:var(--accent); }
  .frame-wrap{ position:relative; flex:1; min-height:0; }
  iframe{
    position:absolute; inset:0; width:100%; height:100%; border:none;
    display:none; background:#eef2f1;
  }
  iframe.active{ display:block; }
</style>
</head>
<body>

  <div class="shell-tabs">
    <button class="shell-tab active" id="tabBtnVitals" onclick="showApp('vitals')">Vitals</button>
    <button class="shell-tab" id="tabBtnCare" onclick="showApp('care')">Care</button>
  </div>

  <div class="frame-wrap">
    <iframe id="frameVitals" class="active" src="vitals.html" title="Vitals Ledger"></iframe>
    <iframe id="frameCare" src="care.html" title="Care Ledger"></iframe>
  </div>

<script>
function showApp(name){
  document.getElementById('frameVitals').classList.toggle('active', name === 'vitals');
  document.getElementById('frameCare').classList.toggle('active', name === 'care');
  document.getElementById('tabBtnVitals').classList.toggle('active', name === 'vitals');
  document.getElementById('tabBtnCare').classList.toggle('active', name === 'care');
  try { sessionStorage.setItem('healthLedgerTab', name); } catch(e){}
}

// Remember which tab was open within this browsing session
try {
  const saved = sessionStorage.getItem('healthLedgerTab');
  if (saved === 'care') showApp('care');
} catch(e){}
</script>

</body>
</html>
